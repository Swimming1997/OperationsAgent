[project]
name = "amiracle-intelligence-engine"
version = "0.1.0"
description = "Intelligence Engine skeleton for operation intelligence center"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
