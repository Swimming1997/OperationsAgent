services:
  postgres:
    image: postgres:16
    container_name: amiracle-intel-postgres
    environment:
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: intel
      POSTGRES_DB: intelligence_engine
    ports:
      # 55432：避开 Windows 上 54329 等端口被保留/占用的情况
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intelligence_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
